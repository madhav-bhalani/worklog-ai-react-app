<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Worklog AI turns repository activity into structured daily worklogs."
    />
    <script>
      (() => {
        const preference = localStorage.getItem("worklog-ai-theme") ?? "system";
        const isDark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      })();
    </script>
    <title>Worklog AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
